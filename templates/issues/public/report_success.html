{% extends "base.html" %}
{% block title %}Пријавата е примена · Sredi{% endblock %}
{% block content %}
<section class="row justify-content-center">
  <div class="col-lg-7">
    <div class="surface-card rounded-3 p-4 p-lg-5 text-center">
      <span class="icon-tile rounded-circle bg-success-subtle text-success d-inline-flex align-items-center justify-content-center mb-3">
        <i class="bi bi-check2-circle fs-3" aria-hidden="true"></i>
      </span>
      <h1 class="h2 fw-bold">Пријавата е примена</h1>
      <p class="text-secondary">Зачувај го кодот. Со него можеш да го провериш статусот без да креираш профил.</p>
      <div class="bg-light border rounded-3 p-4 my-4">
        <p class="text-secondary small text-uppercase ls-2 mb-2">Код за следење</p>
        <p class="display-6 fw-bold text-success font-monospace mb-0">{{ issue.tracking_code }}</p>
      </div>
      <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
        <a class="btn btn-success btn-lg px-4" href="{% url 'track_issue' municipality.slug %}?code={{ issue.tracking_code }}">
          <i class="bi bi-search me-2" aria-hidden="true"></i>Провери статус
        </a>
        <a class="btn btn-outline-secondary btn-lg px-4" href="{% url 'sredi_home' municipality.slug %}">Назад</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
