services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: ${ENV_FILE:-.env.production}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 45
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--header", "X-Forwarded-Proto: https", "http://localhost:8000/health/ready/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: ${ENV_FILE:-.env.production}
    command: python manage.py migrate --noinput
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    environment:
      DOMAIN: ${DOMAIN}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/srv/static:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.2.2
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped

  certbot-issue:
    image: certbot/certbot:v5.2.2
    environment:
      DOMAIN: ${DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    ports:
      - "80:80"
    volumes:
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c 'certbot certonly --standalone --non-interactive --agree-tos --email "$${CERTBOT_EMAIL}" -d "$${DOMAIN}"'
    profiles: ["tools"]

  db:
    image: postgres:16-alpine
    env_file: ${ENV_FILE:-.env.production}
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    env_file: ${ENV_FILE:-.env.production}
    volumes:
      - media_data:/data/media:ro
      - ./scripts:/scripts:ro
    entrypoint: /scripts/backup.sh
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  restore-verify:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    env_file: ${ENV_FILE:-.env.production}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: /scripts/verify_restore.sh
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  restore:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    env_file: ${ENV_FILE:-.env.production}
    volumes:
      - ./scripts:/scripts:ro
      - restore_staging:/restore
    entrypoint: /scripts/restore.sh
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres_data_prod:
  media_data:
  static_data:
  certbot_webroot:
  letsencrypt:
  restore_staging:
